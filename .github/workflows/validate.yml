# Same checks as kristofferR/ha-adjustable-bed: HACS, hassfest, ruff, pyright, pytest.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Ruff check
        run: uvx ruff@0.15.16 check custom_components tests tools
      - name: Ruff format
        run: uvx ruff@0.15.16 format --check custom_components tests tools

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pyright
        run: uvx pyright@1.1.411 --pythonpath .venv/bin/python custom_components tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run --no-sync pytest -q -n auto
