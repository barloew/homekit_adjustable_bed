# A GitHub release for every version tag (vX.Y.Z), with the notes from CHANGELOG.md.
# Releasing is then: bump the version, add the changelog section, commit, tag, push.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, for example v5.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The changelog on the default branch is the source of the notes, so notes can be
      # improved after tagging and published again with a manual run.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check that the tag matches the integration version
        run: |
          version=$(git show "$TAG:custom_components/homekit_adjustable_bed/manifest.json" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest version $version"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "${TAG#v}" > notes.md
      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
